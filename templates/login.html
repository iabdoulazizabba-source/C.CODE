{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-hero">
  <div class="login-brand">
    <img src="{{ url_for('static', filename=brand_logo) }}" alt="{{ company_name }}">
    <h1>{{ company_name }}</h1>
    <p class="login-tagline">Crew Time &amp; Attendance</p>
    <p class="login-fleet">⚓ {{ fleet }}</p>
  </div>

  <div class="card narrow login-card">
    <h2>Log in</h2>
    <form method="post" action="{{ url_for('login') }}">
      <label>Username
        <input type="text" name="username" autofocus required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="hint">Default admin: <code>admin</code> / <code>admin123</code></p>
  </div>
</div>
{% endblock %}
